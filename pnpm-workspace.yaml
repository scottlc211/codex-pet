allowBuilds:
  esbuild: true

# 传递依赖的安全补丁钉版（pnpm 11 起 overrides 只在这里生效，写在 package.json 会被忽略）。
# 这些都是 patch 级升级，只用于把 audit 报出的旧版本顶到已修复版本。
overrides:
  browserslist: 4.29.6
  nanoid: 3.3.20
  postcss: 8.5.33
  source-map-js: 1.2.2

# 依赖安全审计（CI 的 `pnpm audit --audit-level high` 遵循这里的忽略清单）。
# 注意：GHSA 编号必须放在 ignoreGhsas 里，ignoreCves 只认 CVE-xxxx-xxxxx。
auditConfig:
  ignoreGhsas:
    # picomatch ReDoS（GHSA-fc5q-39xc-vjpf）：官方公告给的修复版本是 4.0.8，
    # 但 npm 上 picomatch 最新只到 4.0.7（2026-11 核对），暂时无版本可升。
    # 该依赖只出现在构建期的 glob 匹配里，不参与运行时输入处理；
    # 等 4.0.8 发布后删掉这行、升级 picomatch 即可。
    - GHSA-fc5q-39xc-vjpf
